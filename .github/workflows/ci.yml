name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run installer/workflow tests
        run: bash tests/install_lib_test.sh
      - name: Run Codex review gate tests
        run: bash tests/codex_review_gate_test.sh
